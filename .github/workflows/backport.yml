name: Backport

# Cherry-picks a merged `main` PR onto a release-line branch (upstream-first:
# everything lands on `main` first, then is brought forward). Add a label of
# the form `backport-<branch>` to a PR; when it merges, this opens a backport
# PR against that branch:
#   * backport-stable  -> stable      (the currently-active additive line)
#   * backport-v0.28    -> v0.28       (a specific long-lived line)
#
# The opened backport PR is gated by Tier 1A (see ci.yml). To run the full
# beta-preflight suite on a risky backport, add the `check-release` label to
# the backport PR.
#
# When the cherry-pick conflicts, the backport PR is opened as a *draft* with
# the conflict markers committed; resolve them on the branch, then mark it
# ready for review. The workflow run is also marked failed so the conflict is
# visible without reading the source PR's comments.
#
# Engine: korthout/backport-action (self-contained GitHub Action; no external
# service). Mergify is a documented alternative if richer conflict handling or
# merge queues are ever needed -- see docs/release-process.md.

on:
  pull_request_target:
    types: [closed, labeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  backport:
    name: Backport merged PR
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      contains(join(github.event.pull_request.labels.*.name, ','), 'backport-')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_ORG_TOKEN }}

      - name: Create backport PRs
        id: backport
        uses: korthout/backport-action@2e830a1d0b8269505846ddd407a70876913ad1f8 # v4.6.0
        with:
          github_token: ${{ secrets.RELEASE_PLZ_ORG_TOKEN }}
          comment_style: summary
          # Release-line branches legitimately diverge from `main` (they carry
          # a subset of the workflows, older dependency pins, and their own
          # changelog), so conflicting cherry-picks are routine. Failing them
          # outright produced *nothing* -- no branch, no PR -- while the
          # workflow still reported success, so broken backports were
          # invisible. Commit the first conflict instead and open a draft PR
          # that a human finishes resolving.
          conflict_resolution: draft_commit_conflicts
          # Labels look like `backport-<branch>`; the captured group is the
          # target branch name.
          label_pattern: '^backport-(?<target>.+)$'
          pull_title: '${pull_title} (backport #${pull_number})'
          pull_description: |
            Automated backport of #${pull_number} to `${target_branch}`.

            Upstream-first: this change already merged to `main`. If the
            cherry-pick did not apply cleanly, this PR is a draft containing
            committed conflict markers -- resolve them, make sure the result
            compiles and passes tests on this branch, then mark it ready for
            review.

      # Arm GitHub's native auto-merge on each backport PR that was opened. The
      # actual merge only fires once the target branch's protection rules are
      # satisfied -- i.e. CI is green and at least one approving review is in --
      # so those requirements must be configured as branch protection on the
      # release-line branches (CI passing + 1 required approval). Requires
      # "Allow auto-merge" to be enabled in the repository settings.
      - name: Enable auto-merge on backport PRs
        if: steps.backport.outputs.created_pull_numbers != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_ORG_TOKEN }}
          CREATED_PRS: ${{ steps.backport.outputs.created_pull_numbers }}
        run: |
          for pr in $CREATED_PRS; do
            # Conflicted backports are opened as drafts; GitHub refuses
            # auto-merge on a draft, and they need a human anyway.
            if [ "$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = "true" ]; then
              echo "Backport PR #$pr is a draft (cherry-pick conflict); skipping auto-merge"
              continue
            fi
            echo "Enabling auto-merge (squash) on backport PR #$pr"
            gh pr merge "$pr" --auto --squash --repo "$GITHUB_REPOSITORY"
          done

      # The backport action reports success even when it produces no pull
      # request at all, which let silently-failed backports look green in the
      # Actions list. Make any unsuccessful target turn the run red.
      - name: Fail the run if any backport target was unsuccessful
        if: steps.backport.outputs.was_successful != 'true'
        env:
          BY_TARGET: ${{ steps.backport.outputs.was_successful_by_target }}
          CREATED_PRS: ${{ steps.backport.outputs.created_pull_numbers }}
        run: |
          echo "::error::One or more backport targets were unsuccessful."
          echo "Per-target result: ${BY_TARGET:-(none reported)}"
          echo "Pull requests created: ${CREATED_PRS:-(none)}"
          echo "See the summary comment on the source pull request for details."
          exit 1
