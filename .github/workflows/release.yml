name: Release-plz

# Publishes pending releases, then prepares the next release PR on `stable`.
#
# Under the open-source release process (see docs/release-process.md),
# releases are published ONLY from release-line branches -- never from
# `main` (which is nightly-like and intentionally unpublished) and never
# from a release-candidate branch (which bakes before promotion). On each
# push to `stable`, this workflow publishes any merged release PR and then
# opens/updates the next release PR. The jobs are ordered so release-pr sees
# tags created by release-plz in the publish job.
# Retired `v0.*` lines publish only on manual dispatch. Prepare their release
# PRs separately with release-pr.yml; publishing never prepares their next PR.
#
# release-plz creates the `v*` tag here; that tag then drives the binary
# build in c2patool-release.yml. This workflow does not build binaries
# itself -- keeping binary builds tag-driven means release-candidate builds
# (which never reach this workflow) produce the same binaries via
# release-rc.yml's tags.

permissions:
  pull-requests: write
  contents: write

on:
  push:
    branches:
      - stable # currently-active release line
  workflow_dispatch:

concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Refuse to publish if a [patch]/git dependency is present. main's own
  # `c2pa` dependency is a git dependency by design (see docs/release-
  # process.md, "Tracking c2pa-rs main") -- that must never reach stable.
  guard-no-patch-deps:
    name: Guard against patch/git dependencies
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/stable') ||
      (github.event_name == 'workflow_dispatch' &&
       (github.ref == 'refs/heads/stable' || startsWith(github.ref, 'refs/heads/v0.')) &&
       !contains(github.ref_name, '-rc'))
    uses: ./.github/workflows/check-no-patch-deps.yml

  release-plz:
    name: Release-plz
    runs-on: ubuntu-latest
    needs: guard-no-patch-deps
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/stable') ||
      (github.event_name == 'workflow_dispatch' &&
       (github.ref == 'refs/heads/stable' || startsWith(github.ref, 'refs/heads/v0.')) &&
       !contains(github.ref_name, '-rc'))

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_ORG_TOKEN }}

      - name: Scope release-plz to this release line
        run: python3 .github/scripts/release_plz_config.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master@2026-06-30
        with:
          toolchain: stable

      - name: Run release-plz (publish)
        id: release-plz
        uses: MarcoIeni/release-plz-action@064f4d1e36c843611ddf013be726beaa4ad804db # v0.5.129
        with:
          command: release
          config: ${{ runner.temp }}/release-plz.toml
          verbose: true
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_ORG_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_ORG_TOKEN }}

      - name: Debug release-plz outputs
        env:
          RELEASES: ${{ steps.release-plz.outputs.releases }}
        run: |
          echo "=== Release-plz releases ==="
          echo "$RELEASES"
          echo "==========================="

  release-pr:
    name: Release PR
    if: github.event_name == 'push' && github.ref == 'refs/heads/stable'
    runs-on: ubuntu-latest
    needs: release-plz

    steps:
      # Checkout after publishing so release-plz sees tags created by the
      # preceding job when it calculates the next version.
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_ORG_TOKEN }}

      - name: Scope release-plz to this release line
        run: python3 .github/scripts/release_plz_config.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master@2026-06-30
        with:
          toolchain: stable

      - name: Run release-plz (release-pr)
        uses: MarcoIeni/release-plz-action@064f4d1e36c843611ddf013be726beaa4ad804db # v0.5.129
        with:
          command: release-pr
          config: ${{ runner.temp }}/release-plz.toml
          verbose: true
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_ORG_TOKEN }}
