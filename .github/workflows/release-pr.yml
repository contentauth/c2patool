name: Release-plz PR

# Opens/updates the version-bump + changelog "release PR" on a release-line
# branch (stable, or a retired v0.x line). Merging that PR is what triggers a
# publish (release.yml). For a breaking train, this prepares the 0.(x+1).0 bump
# once the release-candidate branch has been promoted (merged) into stable.
#
# Release-candidate branches themselves do not run release-plz; they only bake
# under the Tier CI suites. This runs release-plz `release-pr` ONLY -- it never
# publishes. Publishing is handled separately by release.yml.
# See docs/release-process.md.

permissions:
  pull-requests: write
  contents: write

on:
  push:
    branches:
      - stable
      - 'v0.*'
  workflow_dispatch:

jobs:
  release-pr:
    name: Release-plz PR
    runs-on: ubuntu-latest

    steps:
      - name: Refuse to run outside a release line
        env:
          RELEASE_LINE: ${{ github.ref_name }}
        run: |
          case "$RELEASE_LINE" in
            stable|v0.*) echo "Generating a release PR for $RELEASE_LINE." ;;
            *)
              echo "::error::release-pr must run on stable or v0.* release lines, not '$RELEASE_LINE'."
              exit 1
              ;;
          esac

      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_ORG_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master@2026-06-30
        with:
          toolchain: stable

      - name: Run release-plz (release-pr)
        uses: MarcoIeni/release-plz-action@064f4d1e36c843611ddf013be726beaa4ad804db # v0.5.129
        with:
          command: release-pr
          verbose: true
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_ORG_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_ORG_TOKEN }}

      # Restrict cleanup to closed release PRs against this release line.
      # Branch names are shared across release lines, so global pruning could
      # delete another line's active release PR.
      - name: Clean up closed release-plz branches for this release line
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_ORG_TOKEN }}
        run: |
          set -euo pipefail
          gh pr list --state closed --base "$GITHUB_REF_NAME" --limit 1000 \
            --json headRefName \
            --jq '.[] | select(.headRefName | startswith("release-plz-")) | .headRefName' |
            while IFS= read -r branch; do
              [ -n "$branch" ] || continue
              if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null; then
                git push origin --delete "$branch"
              fi
            done
